name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-e2e:
    name: Quality sandbox E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install sandbox and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap iproute2 nodejs npm
          python -m pip install -e ".[dev]"
          python -m pip install --target "$RUNNER_TEMP/quality-metrics" coverage==7.17.2 lizard==1.25.0
          npm install --prefix "$RUNNER_TEMP/quality-tools" typescript@5.9.3
      - name: Run every sandbox E2E in its own bounded scope
        run: |
          sudo systemd-run --scope --unit="agent-lease-quality-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -p Delegate=yes -p MemoryMax=2G -p TasksMax=256 -p CPUQuota=100% \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" \
            AGENT_LEASE_E2E_METRICS="$RUNNER_TEMP/quality-metrics" \
            AGENT_LEASE_E2E_TYPESCRIPT="$RUNNER_TEMP/quality-tools/node_modules/typescript" \
            "$(command -v python)" scripts/quality_e2e_scope.py
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
