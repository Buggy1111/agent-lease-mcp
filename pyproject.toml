[project]
name = "agent-lease-mcp"
version = "0.2.0"
description = "Keep Claude Code and Codex from overwriting each other's work: hook-enforced path leases, presence and a shared message log over MCP."
authors = [{ name = "Michal Bugy", email = "michalbugy12@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "multi-agent", "coordination", "file-locking", "leases", "hooks", "claude-code", "codex", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastmcp>=3.4,<4",
]

[project.urls]
Homepage = "https://github.com/Buggy1111/agent-lease-mcp"
Repository = "https://github.com/Buggy1111/agent-lease-mcp"
Issues = "https://github.com/Buggy1111/agent-lease-mcp/issues"
Security = "https://github.com/Buggy1111/agent-lease-mcp/security/advisories/new"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5,<1",
]

[project.scripts]
agent-lease-mcp = "agent_lease_mcp.server:main"
# CLI cesta do místnosti — pro klienty, kde MCP volání narazí na schvalování
# (Codex s approval_policy = "never").
agent-lease = "agent_lease_mcp.cli:main"
# Hook je součást balíčku, ne skript vedle repa — po instalaci má stabilní cestu
# a nepotřebuje sys.path hacky ani vědět, kde projekt leží.
agent-lease-guard = "agent_lease_mcp.guard:main"
# Samostatný, volitelný Bash safety-gate (Jev/TypeSafe AI) — viz ADR 0003.
# Vypnutý ve výchozím stavu, přes JEV_GUARD_ENABLED.
agent-lease-jev-guard = "agent_lease_mcp.jev_guard:main"
# Broker (jediný writer přes Unix socket) a bridge (autonomní worker) — PR #1.
agent-lease-broker = "agent_lease_mcp.broker:main"
agent-lease-bridge = "agent_lease_mcp.bridge:main"
# Automatizace bez uživatele: kontext do session/promptu a úklid nájmů na konci tahu.
agent-lease-context = "agent_lease_mcp.lifecycle:context_main"
agent-lease-release = "agent_lease_mcp.lifecycle:release_main"
# Fáze 2b: lokální loopback live chat nad stejnou DB (viz docs/AGENT-BRIDGE-DEEP-RESEARCH.md).
agent-lease-webui = "agent_lease_mcp.webui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lease_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.sdist]
# Interní pracovní dokumenty do balíčku nepatří. security-findings.md je
# pod embargem, dokud nerozhodne vlastník — nesmí uniknout ani lokálním buildem.
exclude = ["docs/security-findings.md", "TODO.md"]
