[project]
name = "agent-lease-mcp"
version = "0.1.0"
description = "MCP server that keeps two coding agents (Claude Code, Codex) off each other's files — hook-enforced path leases, presence and a shared message log."
authors = [{ name = "Michal Bugy", email = "michalbugy12@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "multi-agent", "coordination", "file-locking", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastmcp>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5,<1",
]

[project.scripts]
agent-lease-mcp = "agent_lease_mcp.server:main"
# Hook je součást balíčku, ne skript vedle repa — po instalaci má stabilní cestu
# a nepotřebuje sys.path hacky ani vědět, kde projekt leží.
agent-lease-guard = "agent_lease_mcp.guard:main"
# Automatizace bez uživatele: kontext do session/promptu a úklid nájmů na konci tahu.
agent-lease-context = "agent_lease_mcp.lifecycle:context_main"
agent-lease-release = "agent_lease_mcp.lifecycle:release_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lease_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
